<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="todo-app">
        <header class="todo-header">
            <h1 class="todo-title">Мои задачи</h1>
            <p class="todo-counter" id="todo-counter">Всего: 0</p>
        </header>

        <form class="todo-form" id="todo-form">
            <input type="text" class="todo-input" id="todo-input" placeholder="Что нужно сделать?" autocomplete="off"
                required>
            <button type="submit" class="todo-add-btn" id="todo-add-btn">
                Добавить
            </button>
        </form>

        <div class="todo-filters" id="todo-filters">
            <button class="filter-btn active" data-filter="all" id="filter-all">Все</button>
            <button class="filter-btn" data-filter="active" id="filter-active">Активные</button>
            <button class="filter-btn" data-filter="completed" id="filter-completed">Выполненные</button>
        </div>

        <ul class="todo-list" id="todo-list">
        
        </ul>

        <div class="todo-empty" id="todo-empty" hidden>
            <p>Задач пока нет 🎉</p>
        </div>

        <footer class="todo-footer" id="todo-footer">
            <span class="todo-stats" id="todo-stats">Активных: 0</span>
            <button class="todo-clear-btn" id="todo-clear-btn">
                Очистить выполненные
            </button>
        </footer>
    </div>

    <script src="dist/typescript.js"></script>
</body>

</html>
